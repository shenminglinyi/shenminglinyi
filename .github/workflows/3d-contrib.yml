name: Generate 3D Contribution Graph

on:
  # Runs daily at 08:15 Beijing time.
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  # Generate once after README or workflow changes so the profile works immediately.
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/3d-contrib.yml

permissions:
  contents: write

concurrency:
  group: 3d-contribution-graph
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate 3D contrib
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet || git commit -m "chore: update 3d contrib [skip ci]"
          git push
