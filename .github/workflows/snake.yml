name: Generate Snake Animation

on:
  # Runs daily at 08:00 Beijing time.
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  # Generate once after README or workflow changes so the profile works immediately.
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: snake-animation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contrib/github-contribution-grid-snake.svg
            assets/contrib/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assets/contrib
          git diff --staged --quiet || git commit -m "chore: update snake svg [skip ci]"
          git push
